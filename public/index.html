<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jukebox Republic</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="screen screen-center">
    <svg class="logo-mark" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="50" cy="50" r="37" fill="none" stroke="currentColor" stroke-width="1"/>
      <rect x="18" y="39" width="8" height="22" rx="2" fill="currentColor"/>
      <rect x="32" y="31" width="8" height="38" rx="2" fill="currentColor"/>
      <rect x="46" y="23" width="8" height="54" rx="2" fill="currentColor"/>
      <rect x="60" y="31" width="8" height="38" rx="2" fill="currentColor"/>
      <rect x="74" y="39" width="8" height="22" rx="2" fill="currentColor"/>
    </svg>
    <h1 class="logo">Jukebox Republic</h1>
    <div class="logo-rule"></div>
    <p class="tagline">The people's queue.</p>

    <div class="card-stack">
      <a class="button button-primary" href="/auth/login">Start spinning</a>

      <form class="card" id="join-form">
        <label for="code">Got the code?</label>
        <input id="code" name="code" placeholder="e.g. K7QRM" autocomplete="off" autocapitalize="characters" maxlength="8" required />
        <button class="button button-secondary" type="submit">Join the spin</button>
      </form>
    </div>
  </main>

  <script>
    // The host-only route lives at /auth/login; everyone else just needs a
    // room code to land on the guest page - no account required.
    document.getElementById('join-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const code = document.getElementById('code').value.trim().toUpperCase();
      if (code) window.location.href = `/guest.html?code=${encodeURIComponent(code)}`;
    });
  </script>
</body>
</html>
