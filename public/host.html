<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jukebox Republic &mdash; hosting</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#16130f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Icon sprite: every icon in the app is defined once here and drawn
       with <use>. Monoline to match the logo mark, and uncoloured so each
       one inherits currentColor from whatever it sits in. Kept in sync
       with the copy in guest.html. -->
  <svg id="icon-sprite" aria-hidden="true" style="display:none">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="icon-queue" viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7"/><circle cx="18" cy="16.5" r="2.5"/><path d="M20.5 16.5V8"/></symbol>
    <symbol id="icon-autopilot" viewBox="0 0 24 24"><path d="M12 4.5l1.7 4.3 4.3 1.7-4.3 1.7L12 16.5l-1.7-4.3L6 10.5l4.3-1.7z"/><path d="M18 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
    <symbol id="icon-skipped" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.3 17.7 17.7 6.3"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="icon-volume-low" viewBox="0 0 24 24"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/></symbol>
    <symbol id="icon-volume-high" viewBox="0 0 24 24"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="icon-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-crown" viewBox="0 0 24 24"><path d="M4 17.5h16M4.5 7l3.5 3.5L12 5l4 5.5L19.5 7l-1.5 9H6z"/></symbol>
    <symbol id="icon-note" viewBox="0 0 24 24"><circle cx="7.5" cy="17" r="2.8"/><path d="M10.3 17V6l9-2v10.5"/><circle cx="16.5" cy="14.5" r="2.8"/></symbol>
    <symbol id="icon-impeached" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v7M8.8 11.3 12 14.5l3.2-3.2"/></symbol>
    <symbol id="icon-scales" viewBox="0 0 24 24"><path d="M12 5v14M7 19h10M4.5 8.5h15"/><path d="M4.5 8.5 2 13h5z"/><path d="M19.5 8.5 17 13h5z"/></symbol>
    <symbol id="icon-crowd" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6"/><path d="M17.5 14.3a5.5 5.5 0 0 1 3 4.7"/></symbol>
    <symbol id="icon-vote-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="icon-vote-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="M12 4.5l2.3 4.9 5.2.7-3.8 3.7.9 5.2-4.6-2.5-4.6 2.5.9-5.2L4.5 10l5.2-.7z"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
    <symbol id="icon-leave" viewBox="0 0 24 24"><path d="M14 5H8a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h6"/><path d="M11 12h9m0 0-3-3m3 3-3 3"/></symbol>
    <symbol id="icon-device" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M9 20h6M12 16v4"/></symbol>
  </svg>

  <main class="screen">
    <!-- Outside the tab panels so it stays put on every tab. Guests
         scanning a QR land straight here and never see the landing page,
         so this is the only thing telling them what app they're in. -->
    <div class="brand-bar">
      <svg class="brand-bar-mark" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="4"/>
        <rect x="18" y="39" width="8" height="22" rx="2" fill="currentColor"/>
        <rect x="32" y="31" width="8" height="38" rx="2" fill="currentColor"/>
        <rect x="46" y="23" width="8" height="54" rx="2" fill="currentColor"/>
        <rect x="60" y="31" width="8" height="38" rx="2" fill="currentColor"/>
        <rect x="74" y="39" width="8" height="22" rx="2" fill="currentColor"/>
      </svg>
      <span class="brand-bar-name">Jukebox Republic</span>
    </div>

    <div class="tab-panel active" id="tab-home">
      <h2 class="section-title">Your session</h2>
      <div class="session-header" id="session-header"></div>

      <h2 class="section-title">Now playing</h2>
      <div id="now-playing"></div>

      <h2 class="section-title">Up next</h2>
      <div class="queue-mode-bar"></div>
      <div class="queue-list" id="queue-list-home"></div>
    </div>

    <div class="tab-panel" id="tab-queue">
      <h2 class="section-title">Queue</h2>
      <div class="queue-mode-bar"></div>
      <div class="queue-list" id="queue-list-tab"></div>
    </div>

    <div class="tab-panel" id="tab-autopilot">
      <h2 class="section-title">Autopilot Mix</h2>
      <p class="tab-blurb">
        Plays automatically once the queue's empty, pulled from a mix of playlists.
        Tap + to send any of these straight into the real queue.
      </p>
      <!-- Host-only: guests browse the mix, the host curates it. -->
      <div class="autopilot-admin">
        <label for="playlist-search-input">Add a playlist to the mix</label>
        <input id="playlist-search-input" type="text" placeholder="Search playlists, or paste a Spotify link" autocomplete="off" />
        <div class="playlist-results" id="playlist-results"></div>
      </div>
      <div class="queue-list" id="autopilot-list"></div>
    </div>

    <div class="tab-panel" id="tab-skipped">
      <h2 class="section-title">Skipped songs</h2>
      <div class="queue-list" id="skipped-list"></div>
    </div>

    <div class="tab-panel" id="tab-history">
      <h2 class="section-title">Recently played</h2>
      <div class="queue-list" id="history-list"></div>
    </div>
  </main>

  <div class="search-results" id="search-results"></div>
  <div class="add-song-bar">
    <input id="search-input" type="text" placeholder="Search Spotify to add a song&hellip;" autocomplete="off" />
  </div>

  <nav class="tab-bar" id="tab-bar">
    <button class="tab-button active" data-tab="home" type="button"><svg class="icon tab-icon"><use href="#icon-home"/></svg>Home</button>
    <button class="tab-button" data-tab="queue" type="button"><svg class="icon tab-icon"><use href="#icon-queue"/></svg>Queue</button>
    <button class="tab-button" data-tab="autopilot" type="button"><svg class="icon tab-icon"><use href="#icon-autopilot"/></svg>Autopilot</button>
    <button class="tab-button" data-tab="skipped" type="button"><svg class="icon tab-icon"><use href="#icon-skipped"/></svg>Skipped</button>
    <button class="tab-button" data-tab="history" type="button"><svg class="icon tab-icon"><use href="#icon-history"/></svg>History</button>
  </nav>

  <div class="name-prompt" id="name-prompt" style="display: none;">
    <form class="card" id="name-form">
      <label for="name-input">What should we call you?</label>
      <input id="name-input" autocomplete="off" maxlength="24" required />
      <button class="button button-primary" type="submit">Let's go</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
