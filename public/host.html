<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jukebox Republic &mdash; hosting</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="screen">
    <div class="tab-panel active" id="tab-home">
      <div class="session-header" id="session-header"></div>

      <h2 class="section-title">Now playing</h2>
      <div id="now-playing"></div>

      <h2 class="section-title">Up next</h2>
      <div class="queue-list" id="queue-list-home"></div>
    </div>

    <div class="tab-panel" id="tab-queue">
      <h2 class="section-title">Queue</h2>
      <div class="queue-list" id="queue-list-tab"></div>
    </div>

    <div class="tab-panel" id="tab-autopilot">
      <p class="tab-blurb">
        Plays automatically once the queue's empty, pulled from a mix of road-trip playlists.
        Tap + to send any of these straight into the real queue.
      </p>
      <div class="queue-list" id="autopilot-list"></div>
    </div>

    <div class="tab-panel" id="tab-skipped">
      <h2 class="section-title">Skipped songs</h2>
      <div class="queue-list" id="skipped-list"></div>
    </div>

    <div class="tab-panel" id="tab-history">
      <h2 class="section-title">Recently played</h2>
      <div class="queue-list" id="history-list"></div>
    </div>
  </main>

  <div class="search-results" id="search-results"></div>
  <div class="add-song-bar">
    <input id="search-input" type="text" placeholder="Search Spotify to add a song&hellip;" autocomplete="off" />
  </div>

  <nav class="tab-bar" id="tab-bar">
    <button class="tab-button active" data-tab="home" type="button"><span class="tab-icon">&#127968;</span>Home</button>
    <button class="tab-button" data-tab="queue" type="button"><span class="tab-icon">&#127925;</span>Queue</button>
    <button class="tab-button" data-tab="autopilot" type="button"><span class="tab-icon">&#10024;</span>Autopilot</button>
    <button class="tab-button" data-tab="skipped" type="button"><span class="tab-icon">&#128078;</span>Skipped</button>
    <button class="tab-button" data-tab="history" type="button"><span class="tab-icon">&#128339;</span>History</button>
  </nav>

  <div class="name-prompt" id="name-prompt" style="display: none;">
    <form class="card" id="name-form">
      <label for="name-input">What should we call you?</label>
      <input id="name-input" autocomplete="off" maxlength="24" required />
      <button class="button button-primary" type="submit">Let's go</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
